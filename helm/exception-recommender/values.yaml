name: exception-recommender
serviceType: managed

global:
  image:
    registry: "gsoci.azurecr.io"
  # Install PSPs
  podSecurityStandards:
    enforced: true

cleanupJob:
  enabled: true

ciliumNetworkPolicy:
  enabled: true

image:
  registry: gsoci.azurecr.io
  name: giantswarm/exception-recommender
  pullPolicy: IfNotPresent

# We install CRDs through a Job with the helm specific crd folder.
crds:
  install: true
  image:
    tag: "1.32.0"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi

nodeSelector: {}
tolerations: []

# Additional custom pod labels
podLabels: {}

# Pod securityContext
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container securityContext
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 100m
    memory: 220Mi
  limits:
    cpu: 100m
    memory: 220Mi

recommender:
  # Install PolicyExceptionDrafts on the giantswarm namespace
  destinationNamespace: policy-exceptions
  targetWorkloads:
    - Deployment
    - DaemonSet
    - StatefulSet
    - CronJob
  targetCategories:
    - Pod Security Standards (Baseline)
    - Pod Security Standards (Restricted)
    - Pod Security Standards
  excludeNamespaces:
    - kube-system
    - giantswarm
  # Create AutomatedExceptions from PolicyReports. Needs PolicyManifests in warming mode, which only
  # policy-meta-operator produces; that operator is not in use.
  enableAutomatedExceptions: false
  createNamespace: false

# Migration bridges: one Giant Swarm PolicyException "<name>-migrated" per legacy kyverno.io/v2
# PolicyException that translates exactly, so kyverno-policy-operator writes a policies.kyverno.io
# exception for it. A migration aid for the Kyverno 1.20 upgrade; on by default, so enabling ER
# bridges a cluster's legacy exceptions. Set to false to run ER without bridging.
migrationBridges:
  enabled: true
  # Must be kyverno-policy-operator's destination namespace.
  namespace: policy-exceptions
