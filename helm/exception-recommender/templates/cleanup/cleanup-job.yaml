{{- if and .Values.cleanupJob.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "recommender.cleanupJob" . }}
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    {{- include "recommender.cleanupJobAnnotations" . | nindent 4 }}
  labels:
    app.kubernetes.io/component: {{ include "recommender.cleanupJob" . | quote }}
    {{- include "labels.selector" . | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ include "recommender.cleanupJob" . | quote }}
        {{- include "labels.selector" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "recommender.cleanupJob" . }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
      containers:
        - name: kubectl
          image: "{{ default .Values.image.registry (include "global.imageRegistry" . ) }}/giantswarm/docker-kubectl:{{ .Values.crds.image.tag }}"
          command:
              - sh
              - '-c'
              - |
                set -o errexit ; set -o xtrace ; set -o nounset

                # Nothing to clean up when the CRD is not installed, e.g. when
                # an install failed before its crd-install hook ran. Any other
                # error fails the Job, so it is retried. stderr is not captured,
                # so warnings cannot be mistaken for the CRD's name.
                crd="$(kubectl get crd policyexceptiondrafts.policy.giantswarm.io --ignore-not-found -o name)"
                if [ -z "${crd}" ]; then
                  echo "policyexceptiondrafts CRD not found, nothing to clean up"
                  exit 0
                fi

                # piping stderr to stdout means kubectl's errors are surfaced
                # in the pod's logs.
                kubectl delete policyexceptiondrafts -n {{ .Values.recommender.destinationNamespace }} --all --ignore-not-found 2>&1
          resources: {{- toYaml .Values.crds.resources | nindent 12 }}
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop:
              - ALL
{{- end -}}
