{{- if .Values.cleanupJob.enabled }}
{{- /*
The cleanup Job gets its own hook ServiceAccount and RBAC instead of the
chart's main ServiceAccount. The main one is a regular release resource,
which does not exist when an install fails in its pre-install hooks. A
pre-delete Job using it then never gets a Pod, and the uninstall times out
with the release stuck in the "uninstalling" state.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "recommender.cleanupJob" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # create hook dependencies in the right order
    "helm.sh/hook-weight": "-4"
    {{- include "recommender.cleanupJobAnnotations" . | nindent 4 }}
  labels:
    app.kubernetes.io/component: {{ include "recommender.cleanupJob" . | quote }}
    {{- include "labels.selector" . | nindent 4 }}
{{- end }}
