{{- if .Values.cleanupJob.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "recommender.cleanupJob" . }}
  annotations:
    # create hook dependencies in the right order
    "helm.sh/hook-weight": "-3"
    {{- include "recommender.cleanupJobAnnotations" . | nindent 4 }}
  labels:
    app.kubernetes.io/component: {{ include "recommender.cleanupJob" . | quote }}
    {{- include "labels.selector" . | nindent 4 }}
rules:
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  resourceNames:
  - policyexceptiondrafts.policy.giantswarm.io
  verbs:
  - get
- apiGroups:
  - policy.giantswarm.io
  resources:
  - policyexceptiondrafts
  verbs:
  - get
  - list
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "recommender.cleanupJob" . }}
  annotations:
    # create hook dependencies in the right order
    "helm.sh/hook-weight": "-2"
    {{- include "recommender.cleanupJobAnnotations" . | nindent 4 }}
  labels:
    app.kubernetes.io/component: {{ include "recommender.cleanupJob" . | quote }}
    {{- include "labels.selector" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "recommender.cleanupJob" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "recommender.cleanupJob" . }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
